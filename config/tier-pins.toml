# /etc/nog/tier-pins.toml
#
# KognogOS factory tier pins. Every package the distro ships gets an
# explicit tier assignment, so a fresh install has opinionated protection
# out of the box. Users can override any pin with `nog pin <pkg> --tier=N`.
#
# Hold durations are owned by /etc/nog/nog.conf (since nog v0.8.0 —
# single source of truth). No `hold_days` field here.

# ─────────────────────────────────────────────────────────────────────────
# TIER 1 — 30-day hold. Boot-critical, kernel-adjacent, ABI-locked.
# A bad update here can brick your machine.
# ─────────────────────────────────────────────────────────────────────────

[tier1]
# false (default): Tier 1 auto-updates after the 30-day hold window.
# true (expert):   Tier 1 stays wholesale held until
#                  `nog unlock <pkg> --promote` releases it.
manual_signoff = false
packages = [
    # Kernels (all common variants — pin is prospective if not installed)
    "linux", "linux-lts", "linux-zen", "linux-hardened",

    # Kernel headers (paired with kernels for DKMS module rebuild)
    "linux-headers", "linux-lts-headers",
    "linux-zen-headers", "linux-hardened-headers",

    # Firmware (wifi, bluetooth, GPU microcode, etc.)
    "linux-firmware",

    # CPU microcode (boot-critical — installer picks one, pin both)
    "intel-ucode", "amd-ucode",

    # System backbone
    "base", "base-devel",
    "systemd", "systemd-libs", "glibc",

    # System plumbing (2026-07-30 official-repo sweep: the base/base-devel
    # meta pins hold only the meta package, not its members — these are the
    # boot/login path and were riding Tier 3)
    "util-linux", "coreutils", "bash", "filesystem",
    # ABI runtime, same class as glibc. NOTE: pkgbase is `gcc`, so pkgbase
    # coupling holds the whole toolchain group 30 days — accepted; the
    # toolchain moves in lockstep anyway.
    "gcc-libs",

    # Login path — a broken PAM stack locks every VT (rescue-media class)
    "pam", "pambase", "shadow",

    # Bootloaders (all variants, prospective — mirrors the kernel philosophy)
    "grub", "efibootmgr", "refind", "limine", "syslinux", "shim",

    # Initramfs path — a bad generator or busybox = unbootable next image
    "mkinitcpio", "mkinitcpio-busybox", "dracut", "booster", "kmod",
    "plymouth",

    # Boot-path filesystem tools — fsck/unlock/assemble run before root mounts
    "e2fsprogs", "btrfs-progs", "xfsprogs", "dosfstools",
    "cryptsetup", "lvm2", "mdadm",

    # Package manager itself (bad update = can't recover)
    "pacman",

    # Graphics stack — mesa + all Vulkan ICDs published in lockstep
    "mesa",
    "vulkan-radeon", "vulkan-intel", "vulkan-icd-loader",

    # 32-bit graphics (ABI-locked to 64-bit mesa; Wine breaks on drift)
    # (lib32-libva-mesa-driver removed 2026-07-30 — absorbed into lib32-mesa)
    "lib32-mesa",
    "lib32-vulkan-radeon", "lib32-vulkan-intel",
    "lib32-vulkan-icd-loader",

    # Nvidia kernel modules — open variants only (Arch dropped the
    # proprietary `nvidia`/-lts/-zen/-dkms packages; stale pins removed
    # 2026-07-30); only the installed one is effective, rest prospective
    "nvidia-open", "nvidia-open-lts", "nvidia-open-dkms",

    # Nvidia userspace (ABI-locked to the kernel module version;
    # nvidia-settings has its own pkgbase so it needs an explicit pin)
    "nvidia-utils", "lib32-nvidia-utils", "nvidia-settings",

    # Official RT kernels (the only official kernels previously missing)
    "linux-rt", "linux-rt-lts",

    # BEGIN CHAOTIC-TIER1 (generated by scripts/chaotic-tier-audit.py)
    # chaotic-aur is enabled by default in KognogOS; its packages are
    # governed by the tier system like any other repo (everything not
    # pinned here rides Tier 3's 7-day hold). Do not hand-edit this
    # block — rerun the audit script and commit the diff.
    # Out-of-tree kernel modules (exact-version dep on a Tier 1 kernel)
    "dahdi-linux-git",
    "wanpipe",
    # Chaotic firmware variants
    "linux-firmware-bnx2x-git",
    "linux-firmware-git",
    "linux-firmware-liquidio-git",
    "linux-firmware-marvell-git",
    "linux-firmware-mellanox-git",
    "linux-firmware-nfp-git",
    "linux-firmware-qcom-git",
    "linux-firmware-qlogic-git",
    "linux-firmware-whence-git",
    # Chaotic kernels (-headers auto-couple)
    "linux-cachyos",
    "linux-cachyos-bore",
    "linux-cachyos-lts",
    "linux-cachyos-rc",
    "linux-cjktty",
    "linux-lqx",
    "linux-lts515",
    "linux-lts61",
    "linux-lts612",
    "linux-lts66",
    "linux-mainline",
    "linux-nitrous",
    "linux-tachyon",
    "linux-vfio",
    "linux-vfio-lts",
    "linux-vfio-x64v3",
    "linux-x64v2",
    "linux-x64v3",
    "linux-x64v4",
    "linux-xanmod-edge-x64v3",
    "linux-xanmod-lts",
    "linux-xanmod-rt",
    "linux-xanmod-x64v2",
    "linux-xanmod-x64v3",
    "linux-znver2",
    "linux-znver3",
    "linux-znver4",
    "linux-znver5",
    # Chaotic mesa builds (lib32 auto-couples)
    "mesa-tkg-git",
    # Chaotic nvidia legacy branches
    "nvidia-340xx",
    "nvidia-340xx-dkms",
    "nvidia-340xx-lts",
    "nvidia-340xx-lts-dkms",
    "nvidia-340xx-settings",
    "nvidia-340xx-utils",
    "nvidia-390xx-dkms",
    "nvidia-390xx-settings",
    "nvidia-390xx-utils",
    "nvidia-470xx-dkms",
    "nvidia-470xx-settings",
    "nvidia-470xx-utils",
    "nvidia-580xx-dkms",
    "nvidia-580xx-settings",
    "nvidia-580xx-utils",
    # Chaotic libc replacements
    "glibc-eac",
    # Chaotic package-manager builds
    "pacman-git",
    # ZFS kernel modules + lockstep tools
    "zfs-dkms",
    "zfs-dkms-git",
    "zfs-utils",
    "zfs-utils-git",
    # Boot-entry writers
    "limine-dracut-support",
    "limine-mkinitcpio-hook",
    "limine-snapper-sync",
    "refind-btrfs",
    # END CHAOTIC-TIER1
]

# ─────────────────────────────────────────────────────────────────────────
# TIER 2 — 15-day hold. Desktop environment, system services, daily workflow.
# A bad update here breaks your desktop but not your boot.
# ─────────────────────────────────────────────────────────────────────────

[tier2]
manual_signoff = false
packages = [
    # KDE Plasma desktop
    "plasma-meta", "plasma-desktop", "sddm",
    "dolphin", "konsole", "kate",
    "okular",                           # universal PDF viewer, daily use

    # Desktop shell proper (2026-07-30 sweep: plasma-meta is a meta package —
    # pinning it holds nothing but itself; these are the actual compositor
    # and shell, previously Tier 3)
    "kwin", "plasma-workspace",

    # Display server (X11 sessions + XWayland apps)
    "xorg-server", "xorg-xwayland",

    # Session core — desktop is dead without the bus; console login survives
    "dbus", "dbus-broker", "polkit", "polkit-kde-agent",

    # Audio stack
    "pipewire", "pipewire-pulse", "pipewire-alsa", "wireplumber",
    # The floor pipewire sits on + the classic "update ate my speakers" pair
    "alsa-lib", "alsa-ucm-conf", "sof-firmware",

    # Network + bluetooth
    "networkmanager", "networkmanager-openvpn",
    "bluez", "bluez-utils",
    # Wi-Fi backends (default + prospective alternate)
    "wpa_supplicant", "iwd",

    # System scripting (many Arch build scripts + sysinfo.py depend on it)
    "python", "python-pip",

    # Wayland-on-Nvidia compositor glue
    "egl-wayland", "egl-gbm", "libva-nvidia-driver",

    # Package ecosystem + core workflow
    "yay",                              # AUR helper
    "pacman-contrib",                   # checkupdates (nog dependency)

    # KognogOS Forge suite
    "nog", "grubforge", "alacrittyforge",

    # Default terminal stack
    "alacritty", "fish",

    # Default editor (early software, but our recommended daily driver —
    # Tier 2 treats it like a mature default and filters out bad releases)
    "fresh-editor-bin",

    # System services users rely on daily
    "cups",                             # print server
    "docker", "docker-compose",         # container runtime
]

# ─────────────────────────────────────────────────────────────────────────
# TIER 3 — 7-day hold. Everything not listed above.
# Fast-track. User-facing apps, media, games, dev tools, CLI utilities,
# browsers, fonts, documentation. Security-critical software (openssh,
# curl, etc.) intentionally lives here so security patches flow quickly.
# ─────────────────────────────────────────────────────────────────────────

[tier3]
manual_signoff = false
# No package list — Tier 3 is the implicit default for anything not
# listed in [tier1] or [tier2]. `nog pin <pkg> --tier=3` removes the
# package from any explicit pin above rather than creating an entry.
