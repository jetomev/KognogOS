# Colours come from the active hypeForge theme (D-36); Win + Alt + T switches it.
[general]
import = ["~/.config/alacritty/themes/hypeforge-current.toml"]

[env]
TERM = "xterm-256color"

[terminal.shell]
program = "/usr/bin/fish"

[window]
decorations = "Full"
opacity = 1.0   # solid: transparency made the light themes look bad (Javier, 2026-09-30)
blur = false

# Floating window that fits ANY display (a 150x50 request overflowed the
# live session's screen — prompt rendered below the visible area,
# 2026-07-31 finding). hypeForge opens it floating at 80 % and draws its title bar.
[window.dimensions]
columns = 110
lines = 28

[window.padding]
x = 15
y = 15

[scrolling]
history = 10000

[font]
size = 11.0   # Javier, 2026-09-30: 11 is the terminal default

[font.normal]
family = "JetBrainsMono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font"
style = "Italic"






[cursor]
blink_interval = 500

[cursor.style]
shape = "Block"
blinking = "On"

[keyboard]
bindings = [
    { key = "V", mods = "Control|Shift", action = "Paste" },
    { key = "C", mods = "Control|Shift", action = "Copy" },
    { key = "+", mods = "Control", action = "IncreaseFontSize" },
    { key = "-", mods = "Control", action = "DecreaseFontSize" },
]
