[General]
# Every colour the greeter uses lives here, so the palette can be
# retuned without touching Main.qml.

# ── the field ─────────────────────────────────────────────────────────
# This is the wallpaper's own background colour, measured rather than
# guessed: `Kognog OS Semi - Logo Catpuccin Mocha.png` is 98.8% #1e1e2e
# and all four corners sample it exactly. Catppuccin Mocha *base*. The
# greeter and the desktop behind it now stand on the same ground.
background=#1e1e2e

# ── the card ──────────────────────────────────────────────────────────
# The card used to be #1e1e2e on black. It cannot stay there: that is now
# the background, and a card the colour of its own background is not a
# card. Moved up one Catppuccin step to surface0, which is what makes the
# shadow legible -- a lighter panel over a darker field reads as floating,
# a darker one reads as a hole.
cardColor=#313244
cardTextColor=#cdd6f4

# A real edge, in the scheme's signature mauve. Deliberately not a tint of
# the background: the whole point is that the card ends somewhere visible.
cardBorderColor=#cba6f7
cardBorderWidth=1

# Corner softening. Set to 0 to return to the original hard rectangle --
# this is the one value here that is taste rather than consequence.
cardRadius=4

# ── the shadow ────────────────────────────────────────────────────────
# Built from stacked translucent rectangles, not a blur effect, because
# this greeter imports QtQuick and nothing else (see the header note in
# Main.qml -- a missing QML module at greeter time is a black screen with
# no way into the machine). Spread and offset are in pixels; opacity is
# per layer and accumulates where the layers overlap, which is what gives
# the falloff.
# BLACK, not crust. Crust (#11111b) sits only 13-19 units away from the
# #1e1e2e background, so the darkest shadow it can physically produce is
# a delta of 19 -- measured at 6, which is invisible. Black has the whole
# range to work with. This is the difference between a shadow that is
# subtle and a shadow that is absent.
shadowColor=#000000
shadowLayers=16
shadowSpread=64
shadowOffset=18
shadowOpacity=0.12

# Card geometry is DERIVED, not chosen. The emblem is 256x256 pixel art
# and must be drawn 1:1: at any non-integer scale, nearest-neighbour
# gives some pixel rows one unit and others two, and the mark visibly
# degrades (it was rendering at 1.375x before). So:
#     cardHeight = 256 + 2 * cardPadding
# Keep that identity if either number changes, and keep the padding equal
# on left/top/bottom so the emblem never touches an edge.
#
# v1.1 checked whether the new username dropdown broke that identity. It
# does not: the form column comes to 234px and needs 322 with padding,
# while the emblem needs 344. The emblem still governs, so the height is
# unchanged. (It was briefly set to 400 here, which simply added dead
# space under the buttons.)
cardWidth=880
cardHeight=344
cardPadding=44
logoSize=256

# ── fields and pickers ────────────────────────────────────────────────
# These used to sit a step ABOVE the card, because the card was then the
# darkest Catppuccin surface short of crust and a well punched into it
# would have vanished. The card has since moved up to surface0, so the
# relationship inverts: wells now go darker than the surface they are cut
# into, which is the normal direction. Same reasoning, opposite result.
fieldColor=#181825
fieldTextColor=#cdd6f4
fieldPlaceholderColor=#7f849c
fieldFocusColor=#0363ef

# The open dropdown list. One step off the field so an open list reads as
# a separate surface rather than a taller field.
listColor=#11111b
listBorderColor=#45475a

# One colour per action, escalating left to right: KognogOS blue to go
# in, peach to warn, KognogOS ember for the most final thing on screen.
accentColor=#0363ef
accentTextColor=#ffffff
warningColor=#fab387
warningTextColor=#11111b
dangerColor=#d9400e
dangerTextColor=#ffffff
neutralColor=#45475a
neutralTextColor=#cdd6f4

errorColor=#f38ba8

# Session picker floats below the card, on the field colour.
footerTextColor=#a6adc8
footerHoverColor=#cdd6f4

logo=assets/logo.png
font=Noto Sans
