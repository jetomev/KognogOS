# KognogOS offers one desktop session: hypeForge (hypeForge D-37, D-38).
# SDDM lists only the sessions in these folders, so Hyprland's own two
# entries in /usr/share/wayland-sessions stay hidden. A plain terminal is
# always one key away: Ctrl + Alt + F2.
[Wayland]
SessionDir=/usr/share/kognog/sessions

[X11]
SessionDir=/usr/share/kognog/x-sessions
